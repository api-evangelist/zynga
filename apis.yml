aid: zynga
name: Zynga
description: 'Zynga is a mobile and social game developer and publisher, founded in
  2007 in San Francisco and a wholly owned subsidiary of Take-Two Interactive since
  May 2022. It operates a portfolio of free-to-play franchises including FarmVille,
  Zynga Poker, Words With Friends, CSR Racing, Empires & Puzzles, Toon Blast, Merge
  Dragons, Harry Potter: Puzzles & Spells, Top Eleven and Golf Rival, built across
  studios such as NaturalMotion, Peak, Rollic, Socialpoint, Small Giant Games, Gram
  Games, Nordeus and StarLark. Zynga publishes a corporate website, an engineering
  blog, a player support center and a responsible disclosure program, but as of September
  2026 it operates no public developer program: there is no developer portal, no API
  reference, and no machine-readable contract on any Zynga-controlled host. The third-party
  "Zynga API" announced at Zynga Unleashed in 2011-2012 was retired with the zynga.com
  third-party publishing platform, and developers.zynga.com no longer resolves.'
